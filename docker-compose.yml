name: notoria

services:
  postgres:
    image: postgres:16-alpine
    container_name: notoria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notoria
      POSTGRES_PASSWORD: notoria
      POSTGRES_DB: notoria
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  listening-extractor:
    build:
      context: ./extractor
      dockerfile: Dockerfile
    container_name: notoria-listening-extractor
    restart: unless-stopped
    environment:
      LISTENING_EXTRACTOR_SECRET: ${LISTENING_EXTRACTOR_SECRET:-dev-extractor-secret}
      PORT: 8787
    ports:
      - "8787:8787"

volumes:
  postgres_data:
